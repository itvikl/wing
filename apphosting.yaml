# Firebase App Hosting configuration
# https://firebase.google.com/docs/app-hosting/configure

env:
  # Firebase client SDK (public — inlined into the browser bundle at build time)
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyB22-19a_oSzc4GzM0GrpRwqyeZsTlRTYU
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: wings-dce9c.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: wings-dce9c
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: wings-dce9c.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "389978483918"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:389978483918:web:167aeae967d52d086e349f"
    availability:
      - BUILD
      - RUNTIME

  # Firebase Admin SDK (server-only, secret) — required at BUILD time too,
  # since it's initialized at module load and Next.js evaluates route
  # modules while collecting page data during `next build`.
  - variable: FIREBASE_ADMIN_PROJECT_ID
    secret: firebase-admin-project-id
    availability:
      - BUILD
      - RUNTIME
  - variable: FIREBASE_ADMIN_CLIENT_EMAIL
    secret: firebase-admin-client-email
    availability:
      - BUILD
      - RUNTIME
  - variable: FIREBASE_ADMIN_PRIVATE_KEY
    secret: firebase-admin-private-key
    availability:
      - BUILD
      - RUNTIME

  # Admin dashboard login allow-list
  - variable: ADMIN_EMAILS
    secret: admin-emails
    availability:
      - BUILD
      - RUNTIME
